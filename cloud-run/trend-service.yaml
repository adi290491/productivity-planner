apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: trend-service
  name: summary-service
  namespace: 918662609235
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cloudsql-instances: 'systemic-productivity-planner:us-central1:planner-prod'
        run.googleapis.com/network: 'default'
        run.googleapis.com/subnetwork: 'default'
        run.googleapis.com/network-tags: 'trend-service'
        run.googleapis.com/min-instances: '0'
    spec:
      serviceAccountName: 918662609235-compute@developer.gserviceaccount.com
      containers:
        - image: 'us-central1-docker.pkg.dev/systemic-productivity-planner/prod-planner-repo/trend-service:manual-v1'
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: '1000m'
              memory: '512Mi'
          env:
            - name: DB_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: DB_HOSTNAME
                  key: 'latest'
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: DB_NAME
                  key: 'latest'
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: DB_PORT
                  key: 'latest'
            - name: DB_SSLMODE
              valueFrom:
                secretKeyRef:
                  name: DB_SSLMODE
                  key: 'latest'
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: DB_USERNAME
                  key: 'latest'
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: DB_PASSWORD
                  key: 'latest'
            - name: PROFILE
              value: prod