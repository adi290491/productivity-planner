name: Mirror DockerHub to Artifact Registry

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  mirror-images:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: systemic-productivity-planner
      REGION: us-central1
      REPOSITORY: prod-planner-repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: systemic-productivity-planner

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Pull from Docker Hub and push to Artifact Registry
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          IMAGES=(
            user-service
            session-service
            summary-service
            gateway
            trend-service
            trend-worker-daily
            trend-worker-weekly
            frontend
          )
          for IMAGE in "${IMAGES[@]}"; do
            docker pull $DOCKER_USERNAME/$IMAGE:latest
            docker tag $DOCKER_USERNAME/$IMAGE:latest $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:latest
            docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:latest
          done

