name: Build and Test

on:
    push:
        branches: [master]
        paths:
          - 'user-service/**'
          - 'gateway/**'
    pull_request:
        branches: [master]
        paths:
          - 'user-service/**'
          - 'gateway/**'

env:
    GO_VERSION: '1.23'

jobs:
    user_service:
        name: Build & Test user-service
        runs-on: ubuntu-latest
        if: contains(github.event.head_commit.message, 'user-service') || github.event_name == 'pull_request'
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                go-version: ${{env.GO_VERSION}}

            - name: Run Go unit tests
              run: |               
                cd user-service
                go mod tidy
                go test ./...          
            
            - name: Build Go services
              run: |
                cd user-service
                go build -o $dir ./cmd
