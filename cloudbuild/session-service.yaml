steps:
  # Step 1: Run tests
  - name: 'golang:1.24-alpine'
    id: 'run-tests'
    dir: 'session-service'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        apk add --no-cache git gcc musl-dev
        go mod download
        go test -v ./...

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    dir: 'session-service'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/session-service:manual-v1'
      - '.'

  # Step 3: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/session-service:manual-v1'

  # Step 4: Deploy to Cloud Run with the corrected path
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'replace'
      - 'cloudrun/session-service.yaml'
      - '--region'
      - 'us-central1'
      - '--project'
      - '$PROJECT_ID'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/session-service:manual-v1'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'

substitutions:
  _REPO_NAME: "prod-planner-repo"