steps:
  # Step 1: Run tests
  - name: 'golang:1.24-alpine'
    id: 'run-tests'
    dir: 'gateway'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        apk add --no-cache git gcc musl-dev
        go mod download
        go test -v ./...

  # Step 2: Build Docker image using the unique commit SHA as the tag
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    dir: 'gateway'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/gateway:$SHORT_SHA'
      - '.'

  # Step 3: Push the newly tagged image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/gateway:$SHORT_SHA'

  # Step 4: Dynamically update the image in the Cloud Run YAML before deploying
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-yaml'
    entrypoint: 'sed'
    args:
      - '-i'
      - 's|image:.*|image: us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/gateway:$SHORT_SHA|g'
      - 'cloudrun/gateway.yaml'

  # Step 5: Deploy to Cloud Run using the updated YAML
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-service'
    args:
      - 'gcloud'
      - 'run'
      - 'services'
      - 'replace'
      - 'cloudrun/gateway.yaml'
      - '--region'
      - 'us-central1'
      - '--project'
      - '$PROJECT_ID'

# The images list should also use the unique tag
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/gateway:$SHORT_SHA'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'

substitutions:
  _REPO_NAME: "prod-planner-repo"