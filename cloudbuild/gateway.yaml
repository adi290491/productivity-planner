steps:
  # Step 1: Run tests
  - name: 'golang:1.24-alpine'
    entrypoint: sh
    args:
      - '-c'
      - |
        cd gateway
        go mod download
        go test -v ./...
    
  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/gateway:$SHORT_SHA'
      - '-f'
      - 'gateway/Dockerfile'
      - '.'
    
  # Step 3: Push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/gateway:$SHORT_SHA'

  # Step 4: Update cloudrun YAML with new image tag
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        sed -i 's|image:.*|image: us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/gateway:$SHORT_SHA|g' cloudrun/gateway.yaml

  # Step 5: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run services replace cloudrun/gateway.yaml \
          --region=us-central1 \
          --project=$PROJECT_ID

  # Step 6: Add IAM policy binding for public access
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run services add-iam-policy-binding gateway \
          --region=us-central1 \
          --member='allUsers' \
          --role='roles/run.invoker' \
          --project=$PROJECT_ID

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/gateway:$SHORT_SHA'

substitutions:
  _REPO_NAME: 'prod-planner-repo'