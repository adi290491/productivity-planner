apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: gateway
  namespace: '918662609235'
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/minScale: '1'
    run.googleapis.com/maxScale: '2'
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"default","tags":["gateway"]}]'
        run.googleapis.com/vpc-access-egress: 'private-ranges-only'
        run.googleapis.com/cpu-throttling: 'true'
    spec:
      serviceAccountName: github-actions-sa@systemic-productivity-planner.iam.gserviceaccount.com
      containers:
        - image: 'us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/gateway:manual-v1'
          ports:
            - name: http1
              containerPort: 8080 
          resources:
            limits:
              cpu: '1000m'
              memory: '512Mi'
          env:
            - name: PROFILE
              value: prod
            - name: USER_SERVICE_URL
              value: 'https://user-service-v4mstn6ikq-uc.a.run.app' 
            - name: SESSION_SERVICE_URL
              value: 'https://session-service-v4mstn6ikq-uc.a.run.app' 
            - name: SUMMARY_SERVICE_URL
              value: 'https://summary-service-v4mstn6ikq-uc.a.run.app' 
            - name: TREND_SERVICE_URL
              value: 'https://trend-service-v4mstn6ikq-uc.a.run.app' 
            - name: FRONTEND_ORIGIN
              value: 'https://systemic-productivity-planner.web.app'
            - name: FRONTEND_ORIGIN_2
              value: 'https://systemic-productivity-planner.firebaseapp.com'
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: JWT_SECRET
                  key: 'latest'
  traffic:
    - percent: 100
      latestRevision: true
