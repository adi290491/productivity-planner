apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: user-service
  namespace: '918662609235'
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/launch-stage: BETA
    run.googleapis.com/ingress: internal
    run.googleapis.com/minScale: '0'
    run.googleapis.com/maxScale: '2'
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cloudsql-instances: 'systemic-productivity-planner:us-central1:planner-prod'
        run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"default","tags":["user-service"]}]'
        run.googleapis.com/vpc-access-egress: 'private-ranges-only'
        run.googleapis.com/cpu-throttling: 'true'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      serviceAccountName: github-actions-sa@systemic-productivity-planner.iam.gserviceaccount.com
      containers:
        - image: 'us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/user-service:$SHORT_SHA'
          ports:
            - name: http1
              containerPort: 8081
          resources:
            limits:
              cpu: '1000m'
              memory: '512Mi'
          env:
            - name: PROFILE
              value: prod
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: DB_HOST
                  key: 'latest'
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: DB_PORT
                  key: 'latest'
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: DB_USER
                  key: 'latest'
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: DB_PASSWORD
                  key: 'latest'
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: DB_NAME
                  key: 'latest'
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: JWT_SECRET
                  key: 'latest'
          startupProbe:
            httpGet:
              path: /ready
              port: 8081
            initialDelaySeconds: 0
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
  traffic:
    - percent: 100
      latestRevision: true